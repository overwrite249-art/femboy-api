name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install pinned scanner outside the checkout
        run: |
          python3 -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install semgrep==1.176.1
      - name: Gateway invariants
        run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config .semgrep/gateway-rules.yml --error --metrics=off --disable-version-check'
      - name: Community rulesets
        run: '"$RUNNER_TEMP/semgrep/bin/semgrep" scan --config p/typescript --config p/secrets --error --metrics=off --disable-version-check'

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Dependency audit (blocking)
        run: npm audit
      - run: npm run check:secrets
